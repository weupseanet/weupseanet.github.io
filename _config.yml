title: Jgjingsgo_OJ
description: "静态的在线测评系统"
url: "https://weupseanet.github.io" 
baseurl: ""

# 指定稳定版本的主题（避免兼容问题）
remote_theme: mmistakes/minimal-mistakes@4.24.0
minimal_mistakes_skin: "neon" 

search: true
search_full_content: false 
search_provider: "lunr" 

permalink: /:categories/:title/
paginate: 5 
paginate_path: /page:num/

author:
  name: "你的名字"
  avatar: "https://cravatar.cn/avatar/e7956356a5d3e33eb79167720a2b3498"
  bio: "国内“高质量”测评平台"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/weupseanet"

# 修复导航栏语法（核心！）
header:
  main:  # 新增 main 层级
    - title: "首页"
      url: /
    - title: "所有题目"
      url: /posts/
    - title: "注册&使用"
      url: /about/

# 新增 Minimal Mistakes 必要配置（避免渲染报错）
include:
  - _pages
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/weupseanet"